<svg width="450" height="150" viewBox="0 0 450 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Red Dots -->
  <g fill="#E5242A">
    <circle cx="120" cy="15" r="9" />
    <circle cx="175" cy="25" r="9" />
    <circle cx="80" cy="35" r="9" />
    <circle cx="40" cy="65" r="9" />
    <circle cx="20" cy="110" r="9" />
    
    <circle cx="45" cy="155" r="9" />
    <circle cx="95" cy="180" r="9" />
    <circle cx="150" cy="180" r="9" />
  </g>
  
  <g fill="#E5242A">
    <circle cx="140" cy="15" r="10" />
    <circle cx="190" cy="35" r="10" />
    <circle cx="90" cy="25" r="10" />
    <circle cx="45" cy="60" r="10" />
    <circle cx="20" cy="105" r="10" />
    <circle cx="35" cy="150" r="10" />
    <circle cx="80" cy="185" r="10" />
    <circle cx="130" cy="195" r="10" />
  </g>

  <!-- Let's calculate proper math for the dots -->
  <g transform="translate(100, 100)">
    <!-- Red outer circle (radius 80) -->
    <circle cx="-80" cy="0" r="10" fill="#E5242A"/> <!-- left -->
    <circle cx="-73.9" cy="-30.6" r="10" fill="#E5242A"/>
    <circle cx="-56.5" cy="-56.5" r="10" fill="#E5242A"/>
    <circle cx="-30.6" cy="-73.9" r="10" fill="#E5242A"/>
    <circle cx="0" cy="-80" r="10" fill="#E5242A"/> <!-- top -->
    <circle cx="30.6" cy="-73.9" r="10" fill="#E5242A"/>
    <circle cx="56.5" cy="-56.5" r="10" fill="#E5242A"/>
    <circle cx="73.9" cy="-30.6" r="10" fill="#E5242A"/>
    
    <circle cx="-73.9" cy="30.6" r="10" fill="#E5242A"/>
    <circle cx="-56.5" cy="56.5" r="10" fill="#E5242A"/>
    <circle cx="-30.6" cy="73.9" r="10" fill="#E5242A"/>
    <circle cx="0" cy="80" r="10" fill="#E5242A"/> <!-- bottom -->
    <circle cx="30.6" cy="73.9" r="10" fill="#E5242A"/>

    <!-- Blue inner circle (radius 50) offset by 18 deg -->
    <circle cx="-47.5" cy="-15.4" r="6" fill="#2E4DA7"/>
    <circle cx="-35.3" cy="-35.3" r="6" fill="#2E4DA7"/>
    <circle cx="-15.4" cy="-47.5" r="6" fill="#2E4DA7"/>
    <circle cx="9.5" cy="-49.1" r="6" fill="#2E4DA7"/>
    <circle cx="32.1" cy="-38.3" r="6" fill="#2E4DA7"/>
    <circle cx="48.5" cy="-12.1" r="6" fill="#2E4DA7"/>

    <circle cx="-47.5" cy="15.4" r="6" fill="#2E4DA7"/>
    <circle cx="-35.3" cy="35.3" r="6" fill="#2E4DA7"/>
    <circle cx="-15.4" cy="47.5" r="6" fill="#2E4DA7"/>
    <circle cx="9.5" cy="49.1" r="6" fill="#2E4DA7"/>
    <circle cx="32.1" cy="38.3" r="6" fill="#2E4DA7"/>
  </g>

  <!-- LUNAS text -->
  <text x="170" y="130" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="105" letter-spacing="-2" fill="#0F1C3F">LUNAS</text>
</svg>
